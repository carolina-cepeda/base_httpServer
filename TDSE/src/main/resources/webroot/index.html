<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A minimal Java HTTP framework demo.">
    <title>LabUrl Framework Demo</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <img class="logo" src="/img/logo.png" alt="LabUrl logo">
        <p class="eyebrow">Java 17 · sockets · lambdas</p>
        <h1 id="page-title">LabUrl Framework Demo</h1>
        <p class="intro">A tiny HTTP framework serving static files and dynamic routes.</p>
      </section>

      <section class="card" aria-labelledby="greeting-title">
        <h2 id="greeting-title">Say hello</h2>
        <form id="hello-form">
          <label for="name">Your name</label>
          <div class="form-row">
            <input id="name" name="name" type="text" placeholder="Ada Lovelace" autocomplete="name">
            <button type="submit">Send greeting</button>
          </div>
        </form>
        <p id="hello-result" class="result" aria-live="polite">Enter a name to call <code>/hello</code>.</p>
      </section>

      <section class="card metric" aria-labelledby="pi-title">
        <div>
          <p class="eyebrow">Dynamic endpoint</p>
          <h2 id="pi-title">π from the server</h2>
        </div>
        <output id="pi-value" aria-live="polite">Loading…</output>
      </section>
    </main>
  </body>
</html>
